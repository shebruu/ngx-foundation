<!--  Écoute l'événement FormFilterChanged pour rechercher -->
<app-car-filters (FormFilterChanged)="onCarFiltersChanged($event)"></app-car-filters>

<div class="parent-controls">
    <h3>Contrôles Parent (ViewChild)</h3>

    <button (click)="resetCarFilters()" class="btn-secondary">
        Reset
    </button>

    <button (click)="fillWithToyotaFilters()" class="btn-secondary">
        Pré-remplir Toyota
    </button>

    <button (click)="getCurrentFormValues()" class="btn-secondary">
        Voir Valeurs
    </button>

    <button (click)="triggerSearch()" class="btn-primary">
        Rechercher
    </button>
</div>

<div class="results">

    <p>Résultats de filtrage
    </p>

</div>
