<h3>User Filters</h3>
<div [formGroup]="userFilterForm" (ngSubmit)="submitForm()" class="form">

    <div class="row">
        <label for="firstname">FirstName</label>
        <input id="firstname" formControlName="firstname" type="text" placeholder="Enter firstname" />

        @if (!userFilterForm.controls['firstname'].valid &&
        userFilterForm.controls['firstname'].dirty &&
        userFilterForm.controls['firstname'].touched ) {
        <p class="error_message_firstname">Firstname invalide</p>
        }
    </div>

    <button (click)="submitForm()">Search</button>

</div>
