@if(title){
<div class="page-title">
    <!-- Property Binding pour le titre -->
    <h1 [class]="style">{{title}}</h1>

    <!-- Subtitle optionnel avec le même alignement que le titre -->
    @if(subtitle){
    <span [class]="style">{{subtitle}}</span>
    }
</div>
}
@else{
<p>Attention tu as oublié le titre de ta page</p>
}
